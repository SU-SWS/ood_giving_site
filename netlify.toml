# BUILD Settings:
# ##############################################################################
[build]
  command = "npm run build"
  publish = ".next"

# FUNCTIONS
# ##############################################################################

# The .env file (written at onPreBuild by netlify-plugin-vault-variables) must be
# bundled because netlify/functions/*.mts call dotenv.config() at runtime.
#
# It must NOT go in [functions] -- that is the "*" key, and @netlify/plugin-nextjs
# reads functions."*".included_files, pushes its own ".env" onto that same array,
# then cp()s every resolved path concurrently through Promise.all. The duplicate
# ".env" becomes two cp(..., { force: true }) calls racing on one destination;
# both see it already exists (copyNextServerCode copied .next/standalone/.env),
# both unlink it, and the loser dies with:
#   ENOENT: unlink '.netlify/functions-internal/___netlify-server-handler/.env'
#
# "**" matches every function name in zip-it-and-ship-it's minimatch check and
# included_files are concatenated across matching keys, so .env is still bundled
# everywhere -- but the Next plugin only reads the literal "*" key, so it never
# sees a duplicate. The Next server handler gets .env from the plugin regardless;
# it always includes .env/.env.production/.env.local/.env.production.local.
[functions."**"]
  included_files = [".env"]

# PLUGINS
# ##############################################################################
[[plugins]]
  package = '/netlify/build-plugins/netlify-plugin-storyblok-redirects/index.mjs'

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Fetch vault plugin needs to come before any of the contextual environment
# variable plugins so they can act on the new vars.
[[plugins]]
  package = "netlify-plugin-vault-variables"
  [plugins.inputs]
    # The vault service endpoint
    endpoint = 'https://vault.stanford.edu'
    # Order doesn't matter here as these will be fetched asynchronously. Try not to have dupes.
    secrets = ['secret/data/projects/adapt/giving']
    # Set which environment variables to use for the approle login
    secretId = 'VAULT_SECRET_ID'
    roleId = 'VAULT_ROLE_ID'
    addContext = true

[[plugins]]
  package = '/netlify/build-plugins/netlify-plugin-contextual-auth/index.mjs'
  [plugins.inputs]
    username = 'adapt'
    password = 'letmein2021'
    context = ['branch-deploy', 'deploy-preview']
    file = '.next/_headers'

# HEADERS
# ##############################################################################
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "default-src https: 'unsafe-inline' 'unsafe-eval'; form-action https:; img-src https: data:; frame-ancestors https://app.storyblok.com"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "vibrate=(), geolocation=(), midi=(), notifications=(), push=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), speaker=()"
